name: learnhub
description: "LearnHub - E-learning Platform Flutter App with Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^17.1.2
  better_player_plus: ^1.0.8
  youtube_player_flutter: ^9.1.2
  http: ^1.5.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  google_fonts: ^6.3.3
  font_awesome_flutter: ^10.12.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  path: ^1.9.1
  flutter_svg: ^2.2.4
  video_player: ^2.10.0
  crypto: ^3.0.7
  pdf: ^3.10.0
  qr_flutter: ^4.1.0
  printing: ^5.11.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.1
  intl: ^0.20.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Logo_final.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/fonts/
