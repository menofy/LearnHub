flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon_new.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon_new.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icon/icon_new.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon_new.png"
